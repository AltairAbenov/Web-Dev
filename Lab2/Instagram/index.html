<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<img class="top-logo"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/512px-Instagram_icon.png"
alt="logo">

<div class="wrapper">

    <img class="phone"
    src="photo2.png"
    alt="photo">

    <div class="right">

        <div class="card">

            <h1 class="instagram-text">Instagram</h1>

            <form>
                <input type="text" placeholder="Phone number, username, or email">
                <input type="password" placeholder="Password">

                <button>Log in</button>
            </form>

            <div class="separator">
                <div class="line"></div>
                <span>OR</span>
                <div class="line"></div>
            </div>

            <a class="facebook" href="#">Log in with Facebook</a>
            <a class="forgot" href="#">Forgot password?</a>

        </div>

        <div class="signup">
            Don't have an account? <b>Sign up</b>
        </div>

    </div>

</div>

</body>
</html>
